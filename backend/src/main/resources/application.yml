server:
  port: 8080

spring:
  application:
    name: setuleads-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:setuleads;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false

geoapify:
  api-key: ${GEOAPIFY_API_KEY:9bd5bb47fbdd4d5da6166f767cf21d3d}

gemini:
  enabled: ${GEMINI_ENABLED:true}
  api-key: ${GEMINI_API_KEY:AIzaSyBlBzT_jp_Z-iC3s8zHQsuSBMNYsU6i7bE}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  temperature: 0.2
  max-output-tokens: 2048

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
